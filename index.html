<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Starlink Internet Access</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1f3a">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b1f3a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Wi-Fi Waves */
    .wifi-wave {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .wave {
      position: absolute;
      border: 2px solid #00c853;
      border-radius: 50%;
      opacity: 0.5;
      animation: pulse 2.5s infinite;
    }

    .wave:nth-child(1) { width: 100px; height: 100px; }
    .wave:nth-child(2) { width: 160px; height: 160px; animation-delay: .5s; }
    .wave:nth-child(3) { width: 220px; height: 220px; animation-delay: 1s; }
    .wave:nth-child(4) { width: 300px; height: 300px; animation-delay: 1.5s; }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.5; }
      100% { transform: scale(2); opacity: 0; }
    }

    #loader {
      position: absolute;
      z-index: 1;
      color: white;
      text-align: center;
    }

    .wifi-logo {
      width: 80px;
      margin-bottom: 15px;
    }

    .card {
      display: none;
      z-index: 1;
      background: white;
      padding: 20px;
      border-radius: 16px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
    }

    .packages { margin: 15px 0; }

    .pkg {
      border: 2px solid #ddd;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .pkg.active {
      border-color: #00c853;
      background: #e9f9ef;
    }

    .price { color: #00c853; font-weight: bold; }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    button {
      background: #00c853;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      border-radius: 12px;
      margin-top: 12px;
      cursor: pointer;
    }

    .dark {
      background: #0b1f3a;
    }

    .small {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- Wi-Fi Waves -->
<div class="wifi-wave">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<!-- Loader -->
<div id="loader">
  <img src="logo.png" class="wifi-logo">
  <p>Connecting to Starlink...<br>Please wait</p>
</div>

<!-- Dashboard -->
<div class="card" id="dashboard">
  <h2>Starlink Internet Access</h2>
  <p>Select a package</p>

  <div class="packages">
    <div class="pkg" onclick="selectPkg(this,'Weekly',350)">
      <strong>Weekly</strong>
      <span class="price">KES 350</span>
    </div>
    <div class="pkg" onclick="selectPkg(this,'Monthly',900)">
      <strong>Monthly</strong>
      <span class="price">KES 900</span>
    </div>
  </div>

  <input type="tel" id="phone" placeholder="Enter phone number">

  <p>
    <strong>Paybill:</strong> 714888<br>
    <strong>Account:</strong> 418441
  </p>

  <button onclick="payWhatsApp()">Pay via WhatsApp</button>
  <button class="dark" onclick="confirmPayment()">I Have Paid</button>

  <p class="small">After payment, access activates automatically.</p>
</div>

<!-- Access Code Page -->
<div class="card" id="accessPage">
  <h2>Internet Activated</h2>
  <p>Your access code:</p>

  <div id="code" style="
    font-size:22px;
    font-weight:bold;
    letter-spacing:3px;
    margin:15px 0;
    color:#00c853;">
  </div>

  <p class="small">
    Reconnect to Wi-Fi if internet does not start.
  </p>

  <button onclick="location.reload()">Reconnect</button>
</div>

<script>
let selectedPackage = "";
let selectedAmount = "";

// Loader delay
setTimeout(() => {
  loader.style.display = "none";
  dashboard.style.display = "block";
}, 3000);

function selectPkg(el,pkg,amount){
  selectedPackage = pkg;
  selectedAmount = amount;
  document.querySelectorAll(".pkg").forEach(p=>p.classList.remove("active"));
  el.classList.add("active");
}

function payWhatsApp(){
  if(!selectedPackage){
    alert("Select a package");
    return;
  }

  const phone = document.getElementById("phone").value;
  if(phone.length < 9){
    alert("Enter valid phone number");
    return;
  }

  const admin = "254712706833";
  const msg = `
Starlink Payment Request
Package: ${selectedPackage}
Amount: KES ${selectedAmount}
Phone: ${phone}
Paybill 714888
Account 418441`;

  window.open(`https://wa.me/${admin}?text=${encodeURIComponent(msg)}`);
}

function confirmPayment(){
  const phone = document.getElementById("phone").value;
  const mpesa = prompt("Enter M-Pesa Transaction Code");

  if(phone.length < 9 || !mpesa){
    alert("Missing details");
    return;
  }

  const admin = "254712706833";
  const msg = `
PAYMENT CONFIRMED
Phone: ${phone}
M-Pesa Code: ${mpesa}`;

  window.open(`https://wa.me/${admin}?text=${encodeURIComponent(msg)}`);

  dashboard.style.display = "none";
  accessPage.style.display = "block";

  document.getElementById("code").innerText =
    Math.random().toString(36).substring(2,6).toUpperCase() + "-" +
    Math.random().toString(36).substring(2,6).toUpperCase();
}

// Service Worker
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
