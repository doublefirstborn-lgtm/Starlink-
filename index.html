<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Starlink Internet Access</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1f3a">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b1f3a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Loader & Wi-Fi Waves */
    .wifi-wave {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .wave {
      position: absolute;
      border: 2px solid #00c853;
      border-radius: 50%;
      opacity: 0.5;
      animation: pulse 2.5s infinite;
    }

    .wave:nth-child(1) { width: 100px; height: 100px; animation-delay: 0s; }
    .wave:nth-child(2) { width: 160px; height: 160px; animation-delay: 0.5s; }
    .wave:nth-child(3) { width: 220px; height: 220px; animation-delay: 1s; }
    .wave:nth-child(4) { width: 300px; height: 300px; animation-delay: 1.5s; }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.5; }
      50% { transform: scale(1.5); opacity: 0.2; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Splash screen text/logo */
    #loader {
      position: absolute;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      text-align: center;
    }

    .wifi-logo {
      width: 80px;
      margin-bottom: 15px;
    }

    /* Dashboard Card */
    .card {
      display: none; /* hidden until loader finishes */
      position: relative;
      z-index: 1;
      background: white;
      padding: 20px;
      border-radius: 16px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    h1 { font-size: 20px; margin-bottom: 5px }

    .packages { margin: 15px 0; }

    .pkg {
      border: 2px solid #ddd;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .pkg.active {
      border-color: #00c853;
      background: #e9f9ef;
    }

    .pkg strong { display: block; font-size: 16px; }
    .price { color: #00c853; font-weight: bold; font-size: 18px; }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    button {
      background: #00c853;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      border-radius: 12px;
      margin-top: 15px;
      cursor: pointer;
    }

    .small { font-size: 13px; color: #555; margin-top: 10px; }
  </style>
</head>
<body>

<!-- Wi-Fi Waves -->
<div class="wifi-wave">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<!-- Splash Loader -->
<div id="loader">
  <img src="logo.png" alt="Starlink Internet " class="wifi-logo">
  <p>Connecting to Starlink... <br>
    Please wait as we connect you to the fastest world network 
  </p>
</div>

<!-- Dashboard -->
<div class="card" id="dashboard">
  <h1>Starlink Internet Access</h1>
  <p>Select a package and pay via M-Pesa</p>

  <div class="packages">
    <div class="pkg" onclick="selectPkg('Weekly',350)">
      <strong>Weekly Subscription</strong>
      <span class="price">KES 350</span>
    </div>

    <div class="pkg" onclick="selectPkg('Monthly',900)">
      <strong>Monthly Subscription</strong>
      <span class="price">KES 900</span>
    </div>
  </div>

  <input type="tel" id="phone" placeholder="Enter your phone number" />

  <p>
    <strong>Paybill:</strong> 714888<br>
    <strong>Account:</strong> 418441
  </p>

  <button onclick="payWhatsApp()">Pay via WhatsApp</button>

  <p class="small">
    After payment, your internet access will be activated.
  </p>
</div>

<script>
let selectedPackage = "";
let selectedAmount = "";

// Show dashboard after 35 seconds
setTimeout(() => {
  document.getElementById("loader").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
}, 35000);

function selectPkg(pkg, amount){
  selectedPackage = pkg;
  selectedAmount = amount;

  document.querySelectorAll('.pkg').forEach(p => p.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function payWhatsApp(){
  const phone = document.getElementById("phone").value;

  if(!selectedPackage){
    alert("Please select a package");
    return;
  }
  if(phone.length < 9){
    alert("Please enter a valid phone number to get access code");
    return;
  }

  const adminWhatsApp = "254712706833"; // YOUR NUMBER
  const message = `
Starlink Internet Payment

Package: ${selectedPackage}
Amount: KES ${selectedAmount}
User Phone: ${phone}

Payment Method:
Paybill 714888
Account 418441 
  `;

  const url = `https://wa.me/${adminWhatsApp}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}

/* Register Service Worker */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
